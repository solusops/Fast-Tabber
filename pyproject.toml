[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fast-tabber"
version = "0.5.1"
description = "Local, agent-native Chrome tab management"
requires-python = ">=3.13"
dependencies = ["mcp==2.3.0", "starlette==1.10.0", "uvicorn==0.54.0", "websockets==17.3", "httpx==0.28.1", "numpy==2.5.4", "scikit-learn==1.9.1", "pywin32==312; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]

[tool.setuptools.packages.find]
include = ["fast_tabber*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
