name: Check and package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements.lock.txt pytest==9.1.1 pytest-asyncio==1.4.0
      - run: python -m pytest -q
      - run: npm test
      - run: python package-release.py
      - run: npm pack --pack-destination dist
      - run: python scripts/check-package.py dist/*.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: fast-tabber-packages
          path: dist/*
